<section class="the-two">

  <div class="two-stage">

    <!-- Ambient particles -->

    <canvas
      #canvas
      class="particle-canvas">
    </canvas>


    <!-- Background glow -->

    <div class="ambient-glow"></div>


    <!-- The photograph -->

    <div class="photo-container">

      <div class="photo-reveal">

        <img
          #heroPhoto
          src="/images/IMG1.jpg"
          alt="The couple"
        />

        <div class="photo-overlay"></div>

        <div class="photo-shimmer"></div>

      </div>

    </div>


    <!-- Couple names -->

    <div class="couple-names">

      <div class="person groom">

        <span class="role">
          THE GROOM
        </span>

        <span class="name">
          Dheeraj
        </span>

      </div>


      <div class="ampersand">
        &amp;
      </div>


      <div class="person bride">

        <span class="role">
          THE BRIDE
        </span>

        <span class="name">
          Drashti
        </span>

      </div>

    </div>


    <!-- Story line -->

    <div class="story-line">

      <span>
        Two stories.
      </span>

      <span>
        One beginning.
      </span>

    </div>


    <!-- Scroll indicator -->

    <div class="scene-progress">

      <span>02</span>

      <div class="progress-line"></div>

      <span>09</span>

    </div>

  </div>

</section>
