<section class="constellation">

  <div class="constellation-stage">

    <!-- Background stars -->
    <canvas
      #canvas
      class="constellation-canvas">
    </canvas>

    <!-- Central constellation -->
    <div class="constellation-system">

      <div class="star star-one">
        <span></span>
      </div>

      <div class="star star-two">
        <span></span>
      </div>

      <div class="orbit orbit-one"></div>
      <div class="orbit orbit-two"></div>

      <svg
        class="constellation-lines"
        viewBox="0 0 100 100"
        preserveAspectRatio="none">

        <line
          class="line line-1"
          x1="20"
          y1="30"
          x2="50"
          y2="50" />

        <line
          class="line line-2"
          x1="80"
          y1="30"
          x2="50"
          y2="50" />

        <line
          class="line line-3"
          x1="50"
          y1="50"
          x2="30"
          y2="75" />

        <line
          class="line line-4"
          x1="50"
          y1="50"
          x2="70"
          y2="75" />

      </svg>

    </div>


    <!-- Story text -->

    <div class="story story-one">

      <span class="eyebrow">
        TWO PATHS
      </span>

      <h2>
        Two stories.
      </h2>

    </div>


    <div class="story story-two">

      <span class="eyebrow">
        ONE JOURNEY
      </span>

      <h2>
        One destination.
      </h2>

    </div>


    <!-- Final heart -->

    <div class="heart">

      <div class="heart-glow"></div>

      <span>♥</span>

    </div>

  </div>

</section>
